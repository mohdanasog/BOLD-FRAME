<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Frame - Poster Design & Videography</title>
    <style>
        /* Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Liquid Glass Background */
        .glass-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #0a0a0a;
            overflow: hidden;
        }

        .liquid-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            filter: blur(140px);
            animation: floatLiquid 18s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes floatLiquid {
            0% { transform: translate(-10%, -10%) scale(1); }
            50% { transform: translate(60vw, 30vh) scale(1.2); }
            100% { transform: translate(10vw, 70vh) scale(0.8); }
        }

        .glass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            pointer-events: none;
        }

        /* Header & Premium Menu */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 35px 8%;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        nav ul li a {
            color: #888;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            padding: 12px 25px;
            border-radius: 40px;
        }

        nav ul li a:hover {
            color: #000;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* Split Screen Hero Section */
        main {
            position: relative;
            z-index: 5;
            padding: 0 8%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 40px;
            flex-grow: 1;
            margin-top: 2vh;
        }

        .hero-text {
            text-align: left;
        }

        .hero-text h1 {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 0.95;
            margin-bottom: 25px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 30%, #444444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 1.1rem;
            color: #aaa;
            max-width: 550px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Premium CTA Button */
        .cta-btn {
            padding: 16px 45px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .cta-btn:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 25px 50px rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        /* Visual Media Frame (Gimbal Photo Section)
           നിങ്ങൾ പറഞ്ഞ ഗിംബൽ പിടിച്ച ഫോട്ടോ വരുന്നത് ഇവിടെയാണ്!
        */
        .hero-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image-frame {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: 500px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            /* ഗിംബൽ അനങ്ങുന്നത് പോലുള്ള സ്മൂത്ത് ആനിമേഷൻ */
            animation: gimbalFloat 6s infinite ease-in-out; 
            background: #111;
        }

        /* ഫോട്ടോയിൽ ലിക്വിഡ് ഗ്ലാസ് റിഫ്ലെക്ഷൻ വരാൻ */
        .image-frame::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ഫോട്ടോ കറുപ്പും വെളുപ്പും (Premium Black & White) ആകാൻ */
            filter: grayscale(100%) contrast(110%); 
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* മൗസ് വെക്കുമ്പോൾ ഫോട്ടോ പതിയെ സൂം ആകും */
        .image-frame:hover img {
            transform: scale(1.08);
        }

        /* Gimbal Floating Animation */
        @keyframes gimbalFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(1.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Footer Section with Contact Info */
        footer {
            position: relative;
            z-index: 10;
            padding: 35px 8%;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(15px);
        }

        .contact-info {
            display: flex;
            gap: 50px;
        }

        .contact-box p {
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .contact-box a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .contact-box a:hover {
            color: #888;
        }

        .footer-logo {
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
            opacity: 0.3;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            main { grid-template-columns: 1fr; text-align: center; margin: 40px 0; }
            .hero-text { display: flex; flex-direction: column; align-items: center; }
            .hero-text h1 { font-size: 3.8rem; }
            .image-frame { height: 400px; }
            footer { flex-direction: column; gap: 25px; text-align: center; }
            .contact-info { flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="glass-bg">
        <div class="liquid-blob"></div>
    </div>
    <div class="glass-overlay"></div>

    <header>
        <div class="logo">Bold Frame</div>
        <nav>
            <ul>
                <li><a href="#posters">Posters</a></li>
                <li><a href="#cinema">Films</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero-text">
            <h1>Bold Frame</h1>
            <p>We craft high-end poster designs and cinematic videography for brands that dare to look premium. Powered by liquid motion and bold shapes.</p>
            <button class="cta-btn" id="exploreBtn">View Portfolio</button>
        </div>

        <div class="hero-image-container">
            <div class="image-frame">
                <img src="https://images.unsplash.com/photo-1619551483861-f3b392500057?auto=format&fit=crop&q=80&w=600" alt="Videographer with Gimbal">
            </div>
        </div>
    </main>

    <footer>
        <div class="contact-info">
            <div class="contact-box">
                <p>Collaborate</p>
                <a href="mailto:create@boldframe.com">create@boldframe.com</a>
            </div>
            <div class="contact-box">
                <p>Call Us</p>
                <a href="tel:+919876543210">+91 98765 43210</a>
            </div>
        </div>
        <div class="footer-logo">© 2026 BOLD FRAME STUDIO.</div>
    </footer>

    <script>
        const blob = document.querySelector('.liquid-blob');
        
        // ബാക്ക്ഗ്രൗണ്ടിലെ ലിക്വിഡ് ഗ്ലാസ് മൂവ്മെന്റ്
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            blob.style.left = (x - 300) + 'px';
            blob.style.top = (y - 300) + 'px';
        });

        // ബട്ടൺ ഇന്ററാക്ഷൻ
        document.getElementById('exploreBtn').addEventListener('click', () => {
            blob.style.transform = 'scale(1.8)';
            blob.style.background = 'rgba(255, 255, 255, 0.25)';
            setTimeout(() => {
                blob.style.transform = 'scale(1)';
                blob.style.background = 'rgba(255, 255, 255, 0.12)';
            }, 1000);
        });
    </script>
</body>
</html>
